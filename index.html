<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pathfinding Visualizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Pathfinding Visualizer</h1>
    <div class="controls">
      <fieldset class="tools">
        <legend>Tool</legend>
        <label><input type="radio" name="tool" value="wall" checked> Wall</label>
        <label><input type="radio" name="tool" value="erase"> Erase</label>
      </fieldset>
      <label>Speed <input type="range" id="speed" min="1" max="10" value="6"></label>
      <button id="run">Run BFS</button>
      <button id="clear-path">Clear path</button>
      <button id="clear-walls">Clear walls</button>
    </div>
  </header>
  <p id="stats" aria-live="polite">Draw walls; drag the green start or red goal to move them.</p>
  <div id="grid" role="grid" aria-label="Pathfinding grid"></div>
  <script src="algo.js"></script>
  <script src="script.js"></script>
</body>
</html>
